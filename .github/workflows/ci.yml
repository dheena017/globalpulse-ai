name: GlobalPulse AI CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-test:
    name: Backend Lint & Test (Python FastAPI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Backend Imports & Syntax
        run: |
          python -c "import sys; sys.path.insert(0, 'backend'); import main; print('Backend loaded successfully:', main.app.title)"

  frontend-build:
    name: Frontend Build & Typecheck (Next.js 14)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Next.js Production App
        working-directory: ./frontend
        run: npm run build
